name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build gcc
      - name: Configure
        run: cmake -S . -B build/core -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build portable library
        run: cmake --build build/core --parallel 2
