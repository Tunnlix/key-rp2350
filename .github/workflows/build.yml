name: Firmware integration checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        complexity: [ON, OFF]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build gcc g++
      - name: Configure selected core release and providers
        run: cmake -S tools/native-checks -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCTAP_PIN_COMPLEXITY=${{ matrix.complexity }} -DTUNNLIX_KEY_CORE_REQUIRE_RELEASE=ON
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Core and board checks
        run: ctest --test-dir build/native --output-on-failure
      - name: Cryptography checks
        run: ./build/native/crypto_check
      - name: Persistent state and PIN-policy checks
        run: ./build/native/storage_check --policy
